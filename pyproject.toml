[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wfx"
version = "0.1.0"
description = "Explainable machine learning for large-sample watershed hydrologic function (CAMELS)"
authors = [{ name = "Kristina Grigoreva" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "shap>=0.44",
  "numba>=0.58",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
raw = ["xarray>=2023.1", "netCDF4>=1.6", "geopandas>=0.14", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
